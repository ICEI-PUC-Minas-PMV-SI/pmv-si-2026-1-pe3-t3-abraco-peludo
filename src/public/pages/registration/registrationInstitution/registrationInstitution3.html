<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Cadastro da Instituição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="./registrationInstitution.css">
</head>
<body>

    <div id="container-nav">
        <div id="logo-abraco">
            <a href="../../../index.html">
                <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
            </a>
        </div>

        <div>
            <a href="../../../index.html" class="active">Home</a>
            <a href="../../../pages/login/login.html" class="active">Login</a>
            <a href="../../../pages/registration/registrationType/registrationType.html" class="active">Faça seu Cadastro</a>
        </div>
    </div>

    <main class="cadastro-wrapper">

        <section class="cadastro-image-side">
            <img
                src="/src/public/assets/img/img-cadastro-ong.svg"
                alt="Mulher segurando um cachorro"
            >
        </section>

        <section class="cadastro-form-side">
            <div class="form-box">
                <h1>Cadastro</h1>
                <div class="underline"></div>

                <p>Cadastre e comece a fazer a diferença na vida de um animal!</p>

                <form id="formCadastroInstituicaoEtapa3" class="cadastro-form" novalidate>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Endereço"
                        required
                    >
                    <span id="erro-endereco" class="form-error" role="alert"></span>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Cidade"
                        required
                    >
                    <span id="erro-cidade" class="form-error" role="alert"></span>

                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Bairro"
                        required
                    >
                    <span id="erro-bairro" class="form-error" role="alert"></span>

                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Número"
                        required
                        inputmode="numeric"
                    >
                    <span id="erro-numero" class="form-error" role="alert"></span>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="CEP"
                        required
                        maxlength="9"
                        inputmode="numeric"
                    >
                    <span id="erro-cep" class="form-error" role="alert"></span>

                    <div class="form-buttons">
                        <button type="submit" class="btn-proximo">
                            <link rel="stylesheet" href="./registrationInstitution4.html">
                            Próximo
                        </button>
                        <button type="button" id="btnVoltar" class="btn-voltar">
                            <link rel="stylesheet" href="./registrationInstitution2.html">
                            Voltar
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <script src="../../../assets/js/config/api.js"></script>
    <script src="../../../assets/js/instituicao/registrationInstitution/registrationInstitution3.js"></script>
    <script src="../../../assets/js/instituicao/registrationInstitution/registrationInstitutionStorage.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Cadastro da Instituição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="./registrationInstitution.css">
</head>
<body>

    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="../../../index.html" class="active">Home</a>
            <a href="../../login/login.html" class="active">Login</a>
            <a href="../../registrationType/registrationType.html" class="active">Faça seu Cadastro</a>
        </div>
    </div>

    <main class="cadastro-wrapper">

        <section class="cadastro-image-side">
            <img
                src="/src/public/assets/img/img-cadastro-ong.svg"
                alt="Mulher segurando um cachorro"
            >
        </section>

        <section class="cadastro-form-side">
            <div class="form-box">
                <h1>Cadastro</h1>
                <div class="underline"></div>

                <p>Cadastre e comece a fazer a diferença na vida de um animal!</p>

                <form id="formCadastroInstituicao" class="cadastro-form" novalidate>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required
                        autocomplete="email"
                    >
                    <span id="erro-email" class="form-error" role="alert"></span>

                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Senha"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="btn-toggle-senha" data-target="senha" aria-label="Mostrar senha">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.27-.27c.63-.63.97-1.46.97-2.35 0-1.66-1.34-3-3-3-.89 0-1.72.34-2.35.97l-.27.27z"/>
                            </svg>
                        </button>
                    </div>
                    <span id="erro-senha" class="form-error" role="alert"></span>

                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Repita a senha"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="btn-toggle-senha" data-target="confirmarSenha" aria-label="Mostrar senha">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.27-.27c.63-.63.97-1.46.97-2.35 0-1.66-1.34-3-3-3-.89 0-1.72.34-2.35.97l-.27.27z"/>
                            </svg>
                        </button>
                    </div>
                    <span id="erro-confirmarSenha" class="form-error" role="alert"></span>

                    <button type="submit" class="btn-proximo">
                        <link rel="stylesheet" href="./registrationInstitution2.html">Próximo
                    </button>
                </form>
            </div>
        </section>

    </main>

    <script src="../../../assets/js/config/api.js"></script>
    <script src="../../../assets/js/instituicao/registrationInstitution/registrationInstitution1.js"></script>
    <script src="../../../assets/js/instituicao/registrationInstitution/registrationInstitutionStorage.js"></script>
</body>
</html>

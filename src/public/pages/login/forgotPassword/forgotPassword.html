<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Esqueci a Senha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="forgotPassword.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="../../../index.html">Home</a></li> 
                <li><a href="../login.html">Login</a></li>
                <li><a href="../../registrationType/registrationType.html">Cadastra-se</a></li>
            </ul>
        </div>
    </nav>

    <main class="forgot-wrapper">
        
        <section class="forgot-image-side">
            <img src="../../../assets/img/img-esqueci-senha.svg" alt="Cachorro e Gato deitados juntos" class="pets-forgot-img">
        </section>

        <section class="forgot-form-side">
            <div class="forgot-box">
                
                <h1 class="forgot-title">Esqueci a senha</h1>
                
                <p class="forgot-subtitle">
                    Digite seu e-mail cadastrado para enviarmos um link de recuperação de senha.
                </p>
                
                <form action="#" method="POST" class="form-container">
                    
                    <div class="input-group">
                        <input type="email" placeholder="E-mail: exemplo@email.com" required class="forgot-input">
                    </div>

                    <p class="back-to-login-text">
                        Lembrou a senha? <a href="../login.html"class="inline-login-link">Entrar</a>
                    </p>

                    <button type="submit" class="btn-forgot-submit">Recuperar senha</button>

                </form>
            </div>
        </section>

    </main>

    <footer class="footer">
        </footer>

</body>
</html>

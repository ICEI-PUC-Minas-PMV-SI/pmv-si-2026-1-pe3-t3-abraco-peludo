<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="../../index.html">

</head>
<body>

    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="../../index.html" class="active">Home</a>
            <a href="../../pages/login/login.html" class="active">Login</a>
            <a href="../registration/registrationType/registrationType.html" class="active">Faça seu Cadastro</a>
        </div>
    </div>

    <main class="login-wrapper">
        
        <section class="login-image-side">
            <img src="../../assets/img/img-login.svg" alt="Gato deitado olhando para a tela" class="cat-login-img">
        </section>

        <section class="login-form-side">
            <div class="login-box">
                <h1 class="login-title">Login</h1>
                
                <form id="formLogin" action="#" method="POST" class="form-container">
                    
                    <div class="input-group">
                        <div class="input-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                        <input type="text" id="identificador" placeholder="Usuário ou E-mail" required class="login-input" autocomplete="username">
                    </div>

                    <div class="input-group input-group-senha">
                        <div class="input-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                        <input type="password" id="senha" placeholder="Senha" required class="login-input login-input-senha" autocomplete="current-password">
                        <button type="button" class="btn-toggle-senha" data-target="senha" aria-label="Mostrar senha">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.27-.27c.63-.63.97-1.46.97-2.35 0-1.66-1.34-3-3-3-.89 0-1.72.34-2.35.97l-.27.27z"/>
                            </svg>
                        </button>
                    </div>

                    <span id="erro-login" class="login-error" role="alert"></span>

                    <a href="./forgotPassword/forgotPassword.html" class="forgot-password">Esqueceu a senha?</a> 

                    <button type="submit" class="btn-login-submit">Login</button>
                    
                    <a href="../../pages/registration/registrationType/registrationType.html" class="btn-login-register">Cadastrar</a>

                </form>
            </div>
        </section>

    </main>

    <script src="../../assets/js/config/api.js"></script>
    <script src="../../assets/js/login/login.js"></script>
</body>
</html>

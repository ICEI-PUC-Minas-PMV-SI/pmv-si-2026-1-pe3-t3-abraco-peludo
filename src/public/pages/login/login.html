                        <input type="password" placeholder="Senha" required class="login-input">

                    <a href="#" class="forgot-password">Esqueceu a senha?</a>

                    <button type="submit" class="btn-login-submit">Login</button>
                    
                    <a href="#" class="btn-login-register">Cadastrar</a>

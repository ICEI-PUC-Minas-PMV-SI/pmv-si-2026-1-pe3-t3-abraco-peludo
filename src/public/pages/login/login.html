<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="../../index.html">

</head>
<body>

    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="../../index.html" class="active">Home</a>
            <a href="../../pages/login/login.html" class="active">Login</a>
            <a href="../../pages/registrationType/registrationType.html" class="active">Faça seu Cadastro</a>
        </div>
    </div>

    <main class="login-wrapper">
        
        <section class="login-image-side">
            <img src="../../assets/img/img-login.svg" alt="Gato deitado olhando para a tela" class="cat-login-img">
        </section>

        <section class="login-form-side">
            <div class="login-box">
                <h1 class="login-title">Login</h1>
                
                <form action="#" method="POST" class="form-container">
                    
                    <div class="input-group">
                        <div class="input-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                        <input type="text" placeholder="Usuário ou E-mail" required class="login-input">
                    </div>

                    <div class="input-group">
                        <div class="input-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                        <input type="password" placeholder="Senha" required class="login-input">
                    </div>

                    <a href="./forgotPassword/forgotPassword.html" class="forgot-password">Esqueceu a senha?</a> 

                    <button type="submit" class="btn-login-submit">Login</button>
                    
                    <a href="#" class="btn-login-register">Cadastrar</a>

                </form>
            </div>
        </section>

    </main>
</body>
</html>

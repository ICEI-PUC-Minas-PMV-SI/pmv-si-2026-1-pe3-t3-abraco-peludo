<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        width: 100%;
        height: 100vh;
      }

      /* HEADER */

      header {
        height: 128px;
        background: #5b382d;

        display: flex;
        justify-content: flex-end;
        align-items: center;

        padding-right: 80px;
      }

      nav {
        display: flex;
        gap: 90px;
      }

      nav a {
        text-decoration: none;
        color: white;
        font-size: 18px;
        transition: 0.3s;
      }

      nav a:hover {
        opacity: 0.8;
      }

      /* CONTEÚDO */

      .container {
        display: flex;
        height: calc(100vh - 128px);
      }

      /* IMAGEM */

      .left-side {
        width: 50%;
      }

      .left-side img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* FORMULÁRIO */

      .right-side {
        width: 50%;
        background: #efe4c8;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-box {
        width: 430px;
        text-align: center;
      }

      .form-box h1 {
        font-size: 60px;
        color: #5b382d;
        font-weight: 700;
      }

      .underline {
        width: 240px;
        height: 8px;
        background: #f98b3d;
        margin: 12px auto 35px;
        border-radius: 10px;
      }

      .form-box p {
        color: #5b382d;
        font-size: 18px;
        margin-bottom: 35px;
        line-height: 1.3;
      }

      /* CAMPOS */

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      input {
        width: 100%;
        height: 48px;

        border: none;
        border-radius: 4px;

        padding-left: 20px;

        font-size: 16px;
        outline: none;
      }

      input::placeholder {
        color: #9a9a9a;
      }

      /* BOTÃO */

      button {
        width: 290px;
        height: 54px;

        margin: 15px auto 0;

        border: none;
        cursor: pointer;

        background: #f98b3d;
        color: white;

        font-size: 20px;
        transition: 0.3s;
      }

      button:hover {
        opacity: 0.9;
      }

      /* RESPONSIVO */

      @media (max-width: 900px) {
        .container {
          flex-direction: column;
        }

        .left-side,
        .right-side {
          width: 100%;
        }

        .left-side {
          height: 300px;
        }

        .right-side {
          padding: 50px 20px;
        }

        nav {
          gap: 30px;
        }

        header {
          justify-content: center;
          padding-right: 0;
        }

        .form-box {
          width: 100%;
          max-width: 430px;
        }

        .form-box h1 {
          font-size: 48px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">Faça seu Cadastro</a>
      </nav>
    </header>

    <main class="container">
      <section class="left-side">
        <img
          src="/src/public/assets/img/img-cadastro-adotante.svg"
          alt="Mulher com cachorro"
        />
      </section>

      <section class="right-side">
        <div class="form-box">
          <h1>Cadastro</h1>

          <div class="underline"></div>

          <p>Cadastre e comece a fazer a diferença na vida de um animal!</p>

          <form>
            <input type="text" placeholder="Nome completo" />

            <input type="text" placeholder="CPF" />

            <input type="text" placeholder="Data de nascimento" />

            <input type="email" placeholder="Email" />

            <input type="password" placeholder="Senha" />

            <input type="password" placeholder="Repita a senha" />

            <a href="/src/public/index.html">
              <button type="submit">Próximo</button>
            </a>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>

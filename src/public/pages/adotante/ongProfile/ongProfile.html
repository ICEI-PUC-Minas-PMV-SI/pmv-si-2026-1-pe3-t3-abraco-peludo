<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil da ONG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../../assets/css/ongProfile/ongProfile.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <link rel="stylesheet" href="../../../assets/css/modal/sairContaModal.css">
    <link rel="stylesheet" href="../../../assets/css/footer/style.css">

    <script src="../../../assets/js/dropDown/dropDown.js"></script>
</head>

<body data-perfil-animal-base="../animalProfile/animalProfile.html">
    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="../animalListing/animalListing.html">Home</a>
            <a href="../adoptionHistory/adoptionHistory.html">Histórico de Adoções</a>

            <div id="userDropdown">
                <a href="#" id="dropdownButtonMenu" class="dropBtn" onclick="toggleDropdownMenu()">
                    <img src="../../../assets/img/icon-perfil.svg" class="user-icon" alt="Perfil">
                </a>

                <div id="dropdownMenuContent" class="dropdown-menu">
                    <a href="../updateRegistration/updateRegistration.html">Configurações da conta <i class="fa-solid fa-gear"></i></a>
                    <a href="#" id="btnLogout">Sair <i class="fa-solid fa-arrow-right-to-bracket"></i></a>
                </div>
            </div>
        </div>
    </div>

    <main class="ong-perfil-page">
        <div id="ongPerfilConteudo" hidden>
            <section class="ong-perfil-topo">
                <div class="ong-perfil-logo-card">
                    <img id="ongPerfilLogo" src="" alt="">
                </div>

                <div class="ong-perfil-info">
                    <h1 id="ongPerfilNome"></h1>
                    <p id="ongPerfilDescricao" class="ong-perfil-descricao"></p>

                    <div class="ong-perfil-pills">
                        <span class="ong-perfil-pill">
                            <img src="../../../assets/img/icon-telefone.svg" alt="">
                            <span id="ongPerfilTelefone"></span>
                        </span>
                        <span class="ong-perfil-pill">
                            <img src="../../../assets/img/icon-localizacao.svg" alt="">
                            <span id="ongPerfilCnpj"></span>
                        </span>
                        <span class="ong-perfil-pill ong-perfil-pill-linha">
                            <img src="../../../assets/img/icon-gato.svg" alt="">
                            <span id="ongPerfilEndereco"></span>
                        </span>
                    </div>
                </div>
            </section>

            <div id="ongAnimaisGrid" class="ong-perfil-grid"></div>

            <div class="ong-perfil-stats">
                <div class="ong-perfil-stat ong-perfil-stat-adotados">
                    <span class="ong-perfil-stat-label">Animais adotados</span>
                    <span id="ongTotalAdotados" class="ong-perfil-stat-valor">0</span>
                </div>
                <div class="ong-perfil-stat ong-perfil-stat-cadastrados">
                    <span class="ong-perfil-stat-label">Animais cadastrados</span>
                    <span id="ongTotalCadastrados" class="ong-perfil-stat-valor">0</span>
                </div>
            </div>
        </div>

        <p id="ongPerfilErro" class="ong-perfil-erro" hidden>ONG não encontrada.</p>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="social-links">

                    </a>
                    <a href="#" class="social-icon" aria-label="X">
                        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                    <a href="#" class="social-icon" aria-label="Facebook">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9 8H7v3h2v9h4v-9h3.6l.4-3H13V6c0-.5.5-1 1-1h2V2h-3c-2.8 0-5 2.2-5 5v1z"/></svg>
                    </a>
                </div>
                <p class="copyright">Copyright&copy; 2026 Abraço Peludo - Todos os direitos reservados</p>
            </div>

            <div class="footer-right">
                <div class="footer-divider"></div>
                <div class="contact-wrapper">
                    <div class="email-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </div>
                    <div class="contact-info">
                        <span class="contact-title">Contato</span>
                        <a href="mailto:abracopeludo@gmail.com" class="contact-email">abracopeludo@gmail.com</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../../../assets/js/config/api.js"></script>
    <script src="../../../assets/js/animais/animaisService.js"></script>
    <script src="../../../assets/js/ongProfile/ongProfile.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => iniciarPerfilOng(obterIdDaUrl));
    </script>
    <script src="../../../assets/js/modal/sairContaModal.js" data-home-url="../../../index.html"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar cadastro</title>

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="./updateRegistration.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">

    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <link rel="stylesheet" href="../../../assets/css/modal/sairContaModal.css">
    <script src="../../../assets/js/dropDown/dropDown.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../assets/css/modal/deleteAccountModal.css">
</head>

<body>
    <div id="container-nav">
        <div id="logo-abraco">
            <a href="../animalListing/animalListing.html">
                <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
            </a>
        </div>

        <div>
            <a href="../animalListing/animalListing.html" class="active">Lista de Animais</a>
            <a href="../adoptionHistory/adoptionHistory.html" class="active">Histórico de Adoções</a> 

            <div id="userDropdown">
                <a href="#" id="dropdownButtonMenu" class="dropBtn" onclick="toggleDropdownMenu()">
                    <img src="../../../assets/img/icon-perfil.svg" class="user-icon">
                </a>

                <div id="dropdownMenuContent" class="dropdown-menu">
                    <a href="../updateRegistration/updateRegistration.html">Configurações da conta <i
                            class="fa-solid fa-gear"></i></a>
                    <a href="#" id="btnLogout">Sair <i class="fa-solid fa-arrow-right-to-bracket"></i></a>
                </div>
            </div>
        </div>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <h1>
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="#" class="asideBtnText special">
                        <i class="fa-regular fa-pen-to-square"></i>
                        <p>Atualizar dados</p>
                    </a>

                    <a href="#" class="asideBtnText" data-excluir-conta>
                        <i class="fa-regular fa-trash-can"></i>
                        <p>Excluir conta</p>
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Atualizar Dados</h2>

                    <form>
                        <div>
                            <label for="nome">Nome Completo</label>
                            <input type="text" input id="nome" placeholder="Nome Completo" required>
                        </div>
                        <div>
                            <label for="cpf">CPF</label>
                            <input type="text" input id="cpf" placeholder="000.000.000-00" required>
                        </div>
                        <div>
                            <label for="nascimento">Data de Nascimento</label>
                            <input type="date" input id="nascimento" placeholder="00/00/0000" required>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="text" input id="nascimento" placeholder="exemplo@gmail.com" required>
                        </div>
                        <div>
                            <label for="senha">Senha</label>
                            <input type="text" input id="senha" placeholder="Senha" required>
                        </div>
                        <div>
                            <label for="confirmarSenha">Confirmar senha</label>
                            <input type="text" input id="confirmarSenha" placeholder="Senha" required>
                        </div>
                    </form>

                    <div id="submitBtn">
                        <button class="btn btnCancelar">Cancelar</button>
                        <button class="btn btnSalvar">Atualizar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../../assets/js/adotante/updateRegistration.js"></script>
    <script src="../../../assets/js/modal/sairContaModal.js" data-home-url="../../../index.html"></script>
    <script src="../../../assets/js/modal/deleteAccountModal.js"></script>
</body>

</html>

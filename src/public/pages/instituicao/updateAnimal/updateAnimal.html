<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar animal</title>

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="./updateAnimal.css">

    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <link rel="stylesheet" href="../../../assets/css/modal/sairContaModal.css">
    <script src="../../../assets/js/dropDown/dropDown.js"></script>
    <script src="../../../assets/js/dropDown/dropDownHistory.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div class="dropDown">
            <div id="dropdownHistory">
                <a href="#" id="dropdownButton" class="active dropBtn" onclick="toggleDropdownHistory()">
                    Painel de Histórico
                </a>
                
                <div id="dropdownHistoryContent" class="dropdown-menu">
                    <a href="../donationHistory/donationHistory.html">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
                    <a href="../animalList/animalList.html">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
                </div>
            </div>

            <a href="#" class="active">Pedidos de Adoção</a>

            <div id="userDropdown">
                <a href="#" id="dropdownButtonMenu" class="dropBtn" onclick="toggleDropdownMenu()">
                    <img src="../../../assets/img/icon-perfil-dog.svg" class="fa-dog">
                </a>

                <div id="dropdownMenuContent" class="dropdown-menu">
                    <a href="#">Visualizar perfil ONG <i class="fa-regular fa-eye"></i></a>
                    <a href="../configureAccount/configureAccount.html">
                        Configurações da conta <i class="fa-solid fa-gear"></i>
                    </a>
                    <a href="../updadeProfile/updadeProfile.html">
                        Atualizar perfil <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                    <a href="#" id="btnLogout">
                        Sair <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <img src="../../../assets/img/icon-cachorro.svg" alt="cachorro">
                <h1>
                    Animais
                </h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="../updateAnimal/updateAnimal.html" class="asideBtnText special">
                        <i class="fa-solid fa-bone"></i>
                        <p>Atualizar animal</p>
                    </a>

                    <a href="#" class="asideBtnText">
                        <i class="fa-regular fa-trash-can"></i>
                        <p>Excluir conta</p>
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Atualizar Cadastro de Animal</h2>

                    <form id="inputContainer">
                        <div>
                            <label for="nome">Nome do animal</label>
                            <input type="text" id="nome" placeholder="Nome do animal" required>
                        </div>
                        <div>
                            <label for="descricao">Descrição do animal</label>
                            <textarea id="descricao" class="descricao" placeholder="Texto" required></textarea>
                        </div>
                        <div>
                            <label for="raca">Raça</label>
                            <input type="text" id="raca" placeholder="Raça" required>
                        </div>
                        <div>
                            <label for="sexo">Sexo</label>
                            <input type="text" id="sexo" placeholder="Sexo" required>
                        </div>
                        <div>
                            <label for="idade">Idade</label>
                            <input type="text" id="idade" placeholder="Ex: 2 anos" required>
                        </div>

                        <div>
                            <label for="porte">Porte</label>
                            <select id="porte" name="porte">
                                <option value="Pequeno">Pequeno</option>
                                <option value="Médio">Médio</option>
                                <option value="Grande">Grande</option>
                            </select>
                        </div>

                        <div id="saudeAnimal">
                            <label>Saúde do animal</label>
                            <div>
                                <div>
                                    <input type="radio" id="saudavel" class="radio" name="saudeAnimal" value="Saudável">
                                    <label for="saudavel">Saudável</label>
                                </div>
                                <div>
                                    <input type="radio" id="tratamento" class="radio" name="saudeAnimal" value="Em tratamento">
                                    <label for="tratamento">Em tratamento</label>
                                </div>
                                <div>
                                    <input type="radio" id="doente" class="radio" name="saudeAnimal" value="Doente">
                                    <label for="doente">Doente</label>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="historico">Mais detalhes do animal</label>
                            <textarea id="historico" class="descricao" placeholder="Texto" required></textarea>
                        </div>
                        <div class="foto-campo">
                            <label for="foto">Mídia</label>
                            <img id="fotoPreview" class="foto-preview" src="" alt="Foto atual do animal" hidden>
                            <p id="fotoNomeAtual" class="foto-nome-atual"></p>
                            <input id="foto" type="file" accept="image/*" class="inputFoto">
                        </div>
                    </form>

                    <p id="editarErro" class="editar-erro" hidden>Animal não encontrado.</p>

                    <div id="submitBtn">
                        <button type="button" class="btn btnCancelar" id="btnCancelar">Cancelar</button>
                        <button type="button" class="btn btnSalvar" id="btnSalvar">Atualizar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../../assets/js/config/api.js"></script>
    <script src="../../../assets/js/animais/animaisService.js"></script>
    <script src="../../../assets/js/instituicao/updateAnimal.js"></script>
    <script src="../../../assets/js/modal/sairContaModal.js" data-home-url="../../../index.html"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar animal</title>

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="./animalRegistration.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">

    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <link rel="stylesheet" href="../../../assets/css/modal/sairContaModal.css">
    <script src="../../../assets/js/dropDown/dropDown.js"></script>
    <script src="../../../assets/js/dropDown/dropDownHistory.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container-nav">
        <div id="logo-abraco">
            <a href="../animalList/animalList.html">
                <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
            </a>
        </div>

        <div class="dropDown">
            <div id="dropdownHistory">
                <a href="#" id="dropdownButton" class="active dropBtn" onclick="toggleDropdownHistory()">
                    Painel de Histórico
                </a>
                
                <div id="dropdownHistoryContent" class="dropdown-menu">
                    <a href="../donationHistory/donationHistory.html">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
                    <a href="../animalList/animalList.html">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
                </div>
            </div>

            <a href="../additionRequests/additionRequests.html" class="active">Pedidos de Adoção</a>

            <div id="userDropdown">
                <a href="#" id="dropdownButtonMenu" class="dropBtn" onclick="toggleDropdownMenu()">
                    <img src="../../../assets/img/icon-perfil-dog.svg" class="fa-dog">
                </a>

                <div id="dropdownMenuContent" class="dropdown-menu">
                    <a href="../ongProfile/ongProfile.html">Visualizar perfil ONG <i class="fa-regular fa-eye"></i></a>
                    <a href="../configureAccount/configureAccount.html">
                        Configurações da conta <i class="fa-solid fa-gear"></i>
                    </a>
                    <a href="../updadeProfile/updadeProfile.html">
                        Atualizar perfil <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                    <a href="#" id="btnLogout">
                        Sair <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="historyDropdown" class="dropdown-menu" style="display: none;">
        <a href="../donationHistory/donationHistory.html">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
        <a href="../animalList/animalList.html">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <img src="../../../assets/img/icon-cachorro.svg" alt="cachorro">
                <h1>Animais</h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="./animalRegistration.html" class="asideBtnText special">
                        <i class="fa-solid fa-bone"></i>
                        <p>Cadastrar animal</p>
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Cadastrar Animal</h2>

                    <form id="inputContainer">
                        <div>
                            <label for="nome">Nome do animal</label>
                            <input type="text" id="nome" placeholder="Nome do animal" required>
                        </div>

                        <div>
                            <label for="especie">Espécie</label>
                            <input type="text" id="especie" placeholder="Ex: Gato, Cachorro" required>
                        </div>

                        <div>
                            <label for="raca">Raça</label>
                            <input type="text" id="raca" placeholder="Raça" required>
                        </div>

                        <div>
                            <label for="sexo">Sexo</label>
                            <input type="text" id="sexo" placeholder="Ex: Macho, Fêmea" required>
                        </div>

                        <div>
                            <label for="idade">Idade (anos)</label>
                            <input type="number" id="idade" min="0" max="99" step="1"
                                inputmode="numeric" placeholder="Idade" required>
                        </div>

                        <div>
                            <label for="porte">Porte</label>
                            <select id="porte" name="Porte">
                                <option value="Pequeno">Pequeno</option>
                                <option value="Médio">Médio</option>
                                <option value="Grande">Grande</option>
                            </select>
                        </div>

                        <div id="saudeAnimal">
                            <label>Saúde do animal</label>
                            <div>
                                <div>
                                    <input type="radio" id="saudavel" class="radio" name="saudeAnimal" value="Saudável">
                                    <label for="saudavel">Saudável</label>
                                </div>
                                <div>
                                    <input type="radio" id="tratamento" class="radio" name="saudeAnimal" value="Em tratamento">
                                    <label for="tratamento">Em tratamento</label>
                                </div>
                                <div>
                                    <input type="radio" id="doente" class="radio" name="saudeAnimal" value="Doente">
                                    <label for="doente">Doente</label>
                                </div>
                            </div>
                        </div>

                        <div id="cuidadosVet">
                            <label>Cuidados veterinários</label>
                            <div>
                                <div>
                                    <input type="checkbox" id="castrado" class="checkbox">
                                    <label for="castrado">Castrado</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="vacinado" class="checkbox">
                                    <label for="vacinado">Vacinado</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="vermifugado" class="checkbox">
                                    <label for="vermifugado">Vermifugado</label>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="descricao">Descrição do animal</label>
                            <textarea id="descricao" placeholder="Descreva o animal brevemente" required></textarea>
                        </div>

                        <div>
                            <label for="historico">Histórico do animal</label>
                            <textarea id="historico" placeholder="Mais detalhes sobre o histórico do animal"></textarea>
                        </div>

                        <div>
                            <label for="foto">Foto</label>
                            <input id="foto" type="file" accept="image/*" class="inputFoto">
                            <img id="fotoPreview" hidden alt="Preview da foto" style="margin-top:10px; width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid #D3D3D3;">
                            <span id="fotoNomeAtual" style="font-size:13px; color:#9B9B9B;"></span>
                        </div>
                    </form>

                    <div id="submitBtn">
                        <button id="btnCancelar" class="btn btnCancelar">Cancelar</button>
                        <button id="btnSalvar" class="btn btnSalvar">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../assets/js/modal/sairContaModal.js" data-home-url="../../../index.html"></script>
    <script src="../../../assets/js/instituicao/animalRegistration.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar cadastro</title>
    <link rel="stylesheet" href="./updateRegistration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container-nav">
        <div>
            <a href="#" class="active">Home</a>
            <a href="#" class="active">Histórico de Adoções</a>
            <a href="#"><i class="fa-solid fa-bars"></i></a>
        </div>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <h1>
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="#" class="asideBtnText special">
                        <i class="fa-regular fa-pen-to-square"></i>
                        Atualizar dados
                    </a>

                    <a href="#" class="asideBtnText">
                        <i class="fa-regular fa-trash-can"></i>
                        Excluir conta
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Atualizar Dados</h2>

                    <form>
                        <div>
                            <label for="nome">Nome Completo</label>
                            <input type="text" input id="nome" placeholder="Nome Completo" required>
                        </div>
                        <div>
                            <label for="cpf">CPF</label>
                            <input type="text" input id="cpf" placeholder="000.000.000-00" required>
                        </div>
                        <div>
                            <label for="nascimento">Data de Nascimento</label>
                            <input type="date" input id="nascimento" placeholder="00/00/0000" required>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="text" input id="nascimento" placeholder="exemplo@gmail.com" required>
                        </div>
                        <div>
                            <label for="senha">Senha</label>
                            <input type="text" input id="senha" placeholder="Senha" required>
                        </div>
                        <div>
                            <label for="confirmarSenha">Confirmar senha</label>
                            <input type="text" input id="confirmarSenha" placeholder="Confirmar senha" required>
                        </div>
                    </form>

                    <div id="submitBtn">
                        <button class="btn">Cancelar</button>
                        <button class="btn">Atualizar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>

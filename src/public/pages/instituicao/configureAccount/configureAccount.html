<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar conta</title>

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="./configureAccount.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">

    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <script src="../../../assets/js/dropDown/dropDown.js"></script>
    <script src="../../../assets/js/dropDown/dropDownHistory.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div class="dropDown">
            <div id="dropdownHistory">
                <a href="#" id="dropdownButton" class="active dropBtn" onclick="toggleDropdownHistory()">
                    Painel de Histórico
                </a>
                
                <div id="dropdownHistoryContent" class="dropdown-menu">
                    <a href="#">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
                    <a href="#">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
                </div>
            </div>

            <a href="#" class="active">Pedidos de Adoção</a>

            <div id="userDropdown">
                <a href="#" id="dropdownButtonMenu" class="dropBtn" onclick="toggleDropdownMenu()">
                    <img src="../../../assets/img/icon-perfil-dog.svg" class="fa-dog">
                </a>

                <div id="dropdownMenuContent" class="dropdown-menu">
                    <a href="#">Visualizar perfil ONG <i class="fa-regular fa-eye"></i></a>
                    <a href="../configureAccount/configureAccount.html">
                        Configurações da conta <i class="fa-solid fa-gear"></i>
                    </a>
                    <a href="../updadeProfile/updadeProfile.html">
                        Atualizar perfil <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                    <a href="#" id="btnLogout">
                        Sair <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="historyDropdown" class="dropdown-menu" style="display: none;">
        <a href="#">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
        <a href="#">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <h1>
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="../configureAccount/configureAccount.html" class="asideBtnText special">
                        <i class="fa-regular fa-pen-to-square"></i>
                        <p>Configurar conta</p>
                    </a>

                    <a href="../updadeProfile/updadeProfile.html" class="asideBtnText">
                        <i class="fa-solid fa-brush"></i>
                        <p>Atualizar perfil</p>
                    </a>

                    <a href="#" class="asideBtnText">
                        <i class="fa-regular fa-trash-can"></i>
                        <p>Excluir conta</p>
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Configurar Conta</h2>

                    <form>
                        <div>
                            <label for="CNPJ">CNPJ</label>
                            <input type="text" input id="CNPJ" placeholder="00.000.000 / 0000-00" required>
                        </div>
                        <div>
                            <label for="cargoResponsavel">Cargo Responsável</label>
                            <input type="text" input id="cargoResponsavel" placeholder="Cargo Responsável" required>
                        </div>
                        <div>
                            <label for="responsavelLegal">Reponsável Legal</label>
                            <input type="text" input id="responsavelLegal" placeholder="Reponsável Legal" required>
                        </div>
                        <div>
                            <label for="dataFundacao">Data da Fundação</label>
                            <input type="date" input id="dataFundacao" required>
                        </div>
                        <div>
                            <label for="tipoInstituicao">Tipo de Instituição</label>
                            <input type="text" input id="tipoInstituicao" placeholder="Tipo de Instituição" required>
                        </div>
                        <div>
                            <label for="endereco">Endereço</label>
                            <input type="text" input id="endereco" placeholder="Endereço" required>
                        </div>

                        <div id="edit3">
                            <div>
                                <label for="bairro">Bairro</label>
                                <input type="text" input id="bairro" placeholder="Bairro" required>
                            </div>
                            <div>
                                <label for="numero">Número</label>
                                <input type="text" input id="numero" placeholder="000" required>
                            </div>
                        </div>

                        <div>
                            <label for="cidade">Cidade</label>
                            <input type="text" input id="cidade" placeholder="Cidade" required>
                        </div>
                        <div>
                            <label for="complemento">Complemento</label>
                            <input type="text" input id="complemento" placeholder="Complemento" required>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="text" input id="endereco" placeholder="Email" required>
                        </div>
                        <div>
                            <label for="senha">Senha</label>
                            <input type="text" input id="senha" placeholder="Senha" required>
                        </div>
                        <div>
                            <label for="confirmarSenha">Confirmar senha</label>
                            <input type="text" input id="confirmarSenha" placeholder="Senha" required>
                        </div>
                    </form>

                    <div id="submitBtn">
                        <button class="btn btnCancelar">Cancelar</button>
                        <button class="btn btnSalvar">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>

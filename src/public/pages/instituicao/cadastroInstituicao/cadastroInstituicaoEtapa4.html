<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraço Peludo - Cadastro da Instituição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">
    <link rel="stylesheet" href="./cadastroInstituicao.css">
</head>
<body>

    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="../../../index.html" class="active">Home</a>
            <a href="../../login/login.html" class="active">Login</a>
            <a href="../../registrationType/registrationType.html" class="active">Faça seu Cadastro</a>
        </div>
    </div>

    <main class="cadastro-wrapper">

        <section class="cadastro-image-side">
            <img
                src="/src/public/assets/img/img-cadastro-ong.svg"
                alt="Mulher segurando um cachorro"
            >
        </section>

        <section class="cadastro-form-side">
            <div class="form-box">
                <h1>Cadastro</h1>
                <div class="underline"></div>

                <p>Cadastre e comece a fazer a diferença na vida de um animal!</p>

                <form id="formCadastroInstituicaoEtapa4" class="cadastro-form" novalidate>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Nome"
                        required
                    >
                    <span id="erro-nome" class="form-error" role="alert"></span>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Descrição"
                        required
                    ></textarea>
                    <span id="erro-descricao" class="form-error" role="alert"></span>

                    <label class="input-file-wrapper" id="fotoWrapper" for="foto">
                        <span class="foto-texto" id="fotoTexto">Foto</span>
                        <input
                            type="file"
                            id="foto"
                            name="foto"
                            accept="image/*"
                        >
                    </label>
                    <span id="erro-foto" class="form-error" role="alert"></span>

                    <div class="form-buttons">
                        <button type="submit" class="btn-proximo">Próximo</button>
                        <button type="button" id="btnVoltar" class="btn-voltar">Voltar</button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <script src="../../../assets/js/instituicao/cadastroInstituicaoStorage.js"></script>
    <script src="../../../assets/js/instituicao/cadastroInstituicaoEtapa4.js"></script>
</body>
</html>

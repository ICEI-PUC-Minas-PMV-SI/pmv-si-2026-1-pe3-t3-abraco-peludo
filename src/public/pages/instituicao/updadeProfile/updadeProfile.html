<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar perfil</title>

    <link rel="icon" type="image/x-icon" href="../../../assets/img/logo-abraco-peludo-aba.svg">    
    <link rel="stylesheet" href="./updadeProfile.css">
    <link rel="stylesheet" href="../../../assets/css/navbar/style.css">

    <link rel="stylesheet" href="../../../assets/css/dropDown/dropDown.css">
    <script src="../../../assets/js/dropDown/dropDown.js"></script>
    <script src="../../../assets/js/dropDown/dropDownHistory.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="container-nav">
        <div id="logo-abraco">
            <img src="../../../assets/img/logo_abraco_peludo.svg" alt="logo abraço peludo">
        </div>

        <div>
            <a href="#" class="active history-icon" onclick="toggleDropdownHistory()">Painel de Histórico</a>
            <a href="#" class="active">Pedidos de Adoção</a>
            <a href="#" class="user-icon" onclick="toggleDropdown()">
                <img src="../../../assets/img/icon-perfil-dog.svg" class="fa-dog">
            </a>
        </div>
    </div>

    <div id="userDropdown" class="dropdown-menu" style="display: none;">
        <a href="#">Visualizar perfil ONG <i class="fa-regular fa-eye"></i></a>
        <a href="../configureAccount/configureAccount.html">Configurações da conta <i class="fa-solid fa-gear"></i></a>
        <a href="../updadeProfile/updadeProfile.html">Atualizar perfil <i class="fa-solid fa-pen-to-square"></i></a>
        <a href="#" id="btnLogout">Sair <i class="fa-solid fa-arrow-right-to-bracket"></i></a>
    </div>

    <div id="historyDropdown" class="dropdown-menu" style="display: none;">
        <a href="#">Histórico de doações realizadas <i class="fa-solid fa-folder-open"></i></a>
        <a href="#">Animais cadastrados <i class="fa-solid fa-cat"></i></a>
    </div>

    <div id="main">
        <aside>
            <div id="asideConfig">
                <h1>
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </h1>
            </div>

            <div id="asideOpt">
                <div id="asideOptBtn">
                    <a href="../configureAccount/configureAccount.html" class="asideBtnText">
                        <i class="fa-regular fa-pen-to-square"></i>
                        <p>Configurar conta</p>
                    </a>

                    <a href="../updadeProfile/updadeProfile.html" class="asideBtnText special">
                        <i class="fa-solid fa-brush"></i>
                        <p>Atualizar perfil</p>
                    </a>

                    <a href="#" class="asideBtnText">
                        <i class="fa-regular fa-trash-can"></i>
                        <p>Excluir conta</p>
                    </a>
                </div>
            </div>
        </aside>

        <div id="editContainer">
            <div id="edit1">
                <div id="edit2">
                    <h2>Atualizar Perfil</h2>

                    <form>
                        <div>
                            <label for="nome">Nome Completo</label>
                            <input type="text" input id="nome" placeholder="Nome Completo" required>
                        </div>
                        <div>
                            <label for="descricao">Descrição</label>
                            <textarea type="text" input id="descricao" placeholder="Descrição" required></textarea>
                        </div>
                        <div>
                            <label for="foto">Mídia</label>
                            <input id="foto" type="file" accept="image/*" class="inputFoto">
                        </div>
                    </form>

                    <div id="submitBtn">
                        <button class="btn btnCancelar">Cancelar</button>
                        <button class="btn btnSalvar">Atualizar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
